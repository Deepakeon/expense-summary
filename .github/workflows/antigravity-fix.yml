name: Antigravity Bug Resolver

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  antigravity-fix:
    if: startsWith(github.event.comment.body, '/fix')
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Antigravity Agent
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_NO_UPDATE_NOTIFIER: "1"
          LOKI_URL: "http://localhost:3100/loki/api/v1/push"
        run: |
          export PATH="/home/linuxbrew/.linuxbrew/bin:$HOME/.local/bin:$PATH"

          echo "=== 👤 User Message ==="
          echo "Issue #$ISSUE_NUMBER: $ISSUE_TITLE"
          echo "Comment: $COMMENT_BODY"
          echo "========================"

          # Invoke agy with stream-json, low reasoning effort, and pipe through loki_forwarder.py
          agy --effort low --output-format stream-json --dangerously-skip-permissions --print "/diagnosing-bugs Resolve issue #$ISSUE_NUMBER: $ISSUE_TITLE.
          Details: $ISSUE_BODY
          Instructions: $COMMENT_BODY

          Repository: expenseSummary
          Tasks:
          1. Create branch 'fix/issue-$ISSUE_NUMBER', commit all changes, and push.
          2. Open a pull request against main using 'gh pr create' with a good summary in the description of the PR:
             - Closes #$ISSUE_NUMBER
             - Root Cause: Why it was happening
             - Fix & Verification: Code changes and tests added to verify the fix." \
          | python3 scripts/observability/loki_forwarder.py 2>&1 | tee agent-output.log

          # Append formatted log to GitHub Actions Step Summary
          echo "## 🤖 Antigravity Agent Execution Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💬 User Message" >> $GITHUB_STEP_SUMMARY
          echo "**Issue #$ISSUE_NUMBER:** $ISSUE_TITLE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "$COMMENT_BODY" ]; then
            echo "**Comment:**" >> $GITHUB_STEP_SUMMARY
            echo "> $COMMENT_BODY" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          echo "### 🧠 AI Response" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -s agent-output.log ]; then
            cat agent-output.log >> $GITHUB_STEP_SUMMARY
          else
            echo "No output recorded." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Upload Agent Execution Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-logs-issue-${{ github.event.issue.number }}
          path: agent-output.log
          retention-days: 7

      - name: Open Pull Request & Notify Issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_NO_UPDATE_NOTIFIER: "1"
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          export PATH="/home/linuxbrew/.linuxbrew/bin:$HOME/.local/bin:$PATH"
          BRANCH="fix/issue-$ISSUE_NUMBER"
          if git ls-remote --exit-code --heads origin "$BRANCH"; then
            PR_URL=$(gh pr list --head "$BRANCH" --json url --jq '.[0].url' 2>/dev/null || echo "")

            if [ -z "$PR_URL" ]; then
              if [ -s agent-output.log ]; then
                SUMMARY_CONTENT=$(cat agent-output.log)
              else
                SUMMARY_CONTENT="Resolved issue #$ISSUE_NUMBER using Antigravity runner."
              fi

              PR_BODY=$(printf "Closes #%s\n\n## Summary\n\n%s" "$ISSUE_NUMBER" "$SUMMARY_CONTENT")

              PR_URL=$(printf "%s" "$PR_BODY" | gh pr create \
                --base main \
                --head "$BRANCH" \
                --title "fix: resolve issue #$ISSUE_NUMBER ($ISSUE_TITLE)" \
                --body-file - || echo "")
            fi

            if [ -n "$PR_URL" ]; then
              AI_RESPONSE=$(cat agent-output.log 2>/dev/null || echo "")
              if [ -n "$AI_RESPONSE" ]; then
                COMMENT_TEXT=$(printf "🤖 **Antigravity Runner** opened pull request %s\n\n### AI Response:\n%s" "$PR_URL" "$AI_RESPONSE")
              else
                COMMENT_TEXT="🤖 **Antigravity Runner** opened pull request $PR_URL with diagnosis and fix details."
              fi
              printf "%s" "$COMMENT_TEXT" | gh issue comment "$ISSUE_NUMBER" --body-file -
            fi
          fi
