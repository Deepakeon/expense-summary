name: Antigravity Bug Resolver

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  antigravity-fix:
    if: startsWith(github.event.comment.body, '/fix')
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Acknowledge Trigger Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REPO: ${{ github.repository }}
        run: |
          export PATH="/home/linuxbrew/.linuxbrew/bin:$HOME/.local/bin:$PATH"
          gh api --method POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content="eyes" || true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run Antigravity Agent
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_NO_UPDATE_NOTIFIER: "1"
          LOKI_URL: "http://localhost:3100/loki/api/v1/push"
        run: |
          export PATH="/home/linuxbrew/.linuxbrew/bin:$HOME/.local/bin:$PATH"

          echo "=== 👤 User Message ==="
          echo "Issue #$ISSUE_NUMBER: $ISSUE_TITLE"
          echo "Comment: $COMMENT_BODY"
          echo "========================"

          # Invoke agy with stream-json, low reasoning effort, and pipe through loki_forwarder.py
          agy --effort low --output-format stream-json --dangerously-skip-permissions --print "/diagnosing-bugs Resolve issue #$ISSUE_NUMBER: $ISSUE_TITLE.
          Details: $ISSUE_BODY
          Instructions: $COMMENT_BODY

          Repository: expenseSummary
          Tasks:
          1. Create branch 'fix/issue-$ISSUE_NUMBER', commit all changes, and push.
          2. Open a pull request against main using 'gh pr create' with a good summary in the description of the PR:
             - Closes #$ISSUE_NUMBER
             - Root Cause: Why it was happening
             - Fix & Verification: Code changes and tests added to verify the fix." \
          | python3 scripts/observability/loki_forwarder.py 2>&1 | tee agent-output.log

          # Append formatted log to GitHub Actions Step Summary
          echo "## 🤖 Antigravity Agent Execution Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 💬 User Message" >> $GITHUB_STEP_SUMMARY
          echo "**Issue #$ISSUE_NUMBER:** $ISSUE_TITLE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "$COMMENT_BODY" ]; then
            echo "**Comment:**" >> $GITHUB_STEP_SUMMARY
            echo "> $COMMENT_BODY" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          echo "### 🧠 AI Response" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -s agent-output.log ]; then
            cat agent-output.log >> $GITHUB_STEP_SUMMARY
          else
            echo "No output recorded." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Upload Agent Execution Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-logs-issue-${{ github.event.issue.number }}
          path: agent-output.log
          retention-days: 7

      - name: Open Pull Request & Notify Issue on Success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_NO_UPDATE_NOTIFIER: "1"
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          export PATH="/home/linuxbrew/.linuxbrew/bin:$HOME/.local/bin:$PATH"
          python3 - << 'PYEOF'
          import os
          import subprocess

          issue_num = os.environ.get("ISSUE_NUMBER", "")
          issue_title = os.environ.get("ISSUE_TITLE", "")
          repo = os.environ.get("REPO", "")
          run_url = os.environ.get("RUN_URL", "")
          run_id = os.environ.get("RUN_ID", "")
          branch = f"fix/issue-{issue_num}"

          ai_response = ""
          if os.path.exists("agent-output.log"):
              with open("agent-output.log", "r", encoding="utf-8", errors="replace") as f:
                  ai_response = f.read().strip()

          pr_url = ""
          pr_err = ""

          res_ls = subprocess.run(["git", "ls-remote", "--exit-code", "--heads", "origin", branch], capture_output=True, text=True)
          if res_ls.returncode == 0:
              res_list = subprocess.run(["gh", "pr", "list", "--head", branch, "--json", "url", "--jq", ".[0].url"], capture_output=True, text=True)
              existing_url = res_list.stdout.strip()

              if existing_url:
                  pr_url = existing_url
              else:
                  summary = ai_response if ai_response else f"Resolved issue #{issue_num} using Antigravity runner."
                  pr_body = f"Closes #{issue_num}\n\n## Summary\n\n{summary}"
                  res_create = subprocess.run(
                      [
                          "gh", "pr", "create",
                          "--base", "main",
                          "--head", branch,
                          "--title", f"fix: resolve issue #{issue_num} ({issue_title})",
                          "--body-file", "-"
                      ],
                      input=pr_body,
                      capture_output=True,
                      text=True
                  )
                  if res_create.returncode == 0:
                      pr_url = res_create.stdout.strip()
                  else:
                      pr_err = (res_create.stderr or res_create.stdout).strip()

          summary_section = ai_response if ai_response else "No summary recorded."

          if pr_url:
              comment_body = (
                  f"🤖 **Antigravity Runner** successfully resolved issue #{issue_num} and opened pull request: {pr_url}\n\n"
                  f"### 📋 Diagnosis & Fix Summary:\n{summary_section}\n\n"
                  f"---\n*Run details: [Workflow Run #{run_id}]({run_url})*"
              )
          elif pr_err:
              comment_body = (
                  f"🤖 **Antigravity Runner** completed the fix and pushed branch `{branch}`, but could not create a pull request automatically.\n\n"
                  f"**Error Details:**\n```\n{pr_err}\n```\n\n"
                  f"> 💡 **Action Required:**\n"
                  f"> 1. Enable **Settings → Actions → General → Workflow permissions → Allow GitHub Actions to create and approve pull requests**.\n"
                  f"> 2. Or manually create a PR from branch [`{branch}`](https://github.com/{repo}/tree/{branch}) against `main`.\n\n"
                  f"### 📋 Diagnosis & Fix Summary:\n{summary_section}\n\n"
                  f"---\n*Run details: [Workflow Run #{run_id}]({run_url})*"
              )
          else:
              comment_body = (
                  f"🤖 **Antigravity Runner** completed execution for issue #{issue_num}.\n\n"
                  f"### 📋 AI Diagnosis & Response:\n{summary_section}\n\n"
                  f"---\n*Run details: [Workflow Run #{run_id}]({run_url})*"
              )

          subprocess.run(["gh", "issue", "comment", str(issue_num), "--body-file", "-"], input=comment_body, text=True, check=True)
          PYEOF

      - name: Notify Issue on Failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_NO_UPDATE_NOTIFIER: "1"
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          export PATH="/home/linuxbrew/.linuxbrew/bin:$HOME/.local/bin:$PATH"
          python3 - << 'PYEOF'
          import os
          import subprocess

          issue_num = os.environ.get("ISSUE_NUMBER", "")
          run_url = os.environ.get("RUN_URL", "")
          run_id = os.environ.get("RUN_ID", "")
          job_status = os.environ.get("JOB_STATUS", "failed")

          log_tail = ""
          if os.path.exists("agent-output.log"):
              with open("agent-output.log", "r", encoding="utf-8", errors="replace") as f:
                  lines = f.readlines()
                  log_tail = "".join(lines[-30:]).strip()

          comment_body = (
              f"❌ **Antigravity Runner** execution **{job_status}** for issue #{issue_num}.\n\n"
              f"### 🔍 Actionable Insights:\n"
              f"- **Run Logs**: Inspect workflow step outputs at [Workflow Run #{run_id}]({run_url}).\n"
              f"- **Artifacts**: Download `antigravity-logs-issue-{issue_num}` from the workflow run summary for the full execution trace.\n"
              f"- **Loki Telemetry**: Query Loki in Grafana via `{{app=\"antigravity-runner\", issue=\"{issue_num}\", run_id=\"{run_id}\"}}`.\n"
              f"- **Next Steps**: Re-trigger with `/fix <additional details>` or inspect failure in the logs above.\n"
          )

          if log_tail:
              comment_body += f"\n### ⚠️ Recent Log Excerpt:\n```\n{log_tail}\n```\n"

          comment_body += f"\n---\n*Run details: [Workflow Run #{run_id}]({run_url})*"

          subprocess.run(["gh", "issue", "comment", str(issue_num), "--body-file", "-"], input=comment_body, text=True)
          PYEOF
